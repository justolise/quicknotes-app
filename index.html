<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Fast & Simple Note Taking</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="header-top">
        <h1>QuickNotes</h1>
        <button type="button" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
      </div>
      <p class="tagline">Stay organized and consistent on the go with QuickNotes, the best note-taking app</p>
    </div>
  </header>

  <main>
    <!-- Add a note section -->
    <section class="card-section" aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-group form-group-input">
          <label for="note-input">Note Content</label>
          <input 
            type="text" 
            id="note-input" 
            name="note" 
            placeholder="What's on your mind? (up to 200 chars)" 
            autocomplete="on"
          >
        </div>

        <div class="form-group form-group-select">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <div class="form-group form-group-button">
          <button type="submit" id="add-note-btn">Add Note</button>
        </div>
      </form>
      <p id="error-message" role="alert" aria-live="polite"></p>
    </section>

    <!-- Your notes section -->
    <section class="card-section" aria-labelledby="your-notes-heading">
      <div class="notes-header">
        <h2 id="your-notes-heading">Your notes</h2>
        <button type="button" id="clear-all-btn" class="btn-clear" title="Delete all notes">Clear all</button>
      </div>

      <div class="controls-bar">
        <div class="search-wrapper">
          <label for="search-input" class="search-label">&#128269; Search notes</label>
          <input 
            type="search" 
            id="search-input" 
            placeholder="Type a keyword to filter notes..." 
            autocomplete="off"
          >
        </div>
        <p id="note-count">You have no notes yet.</p>
      </div>

      <ul id="notes-list" aria-label="Notes list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
  </footer>
</body>
</html>
